name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/APPROVED_CONTRIBUTORS
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      tag:
        description: Release tag whose version should be injected before checks
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - uses: pnpm/setup@v3.1.1
        with:
          version: 12.15.0
          runtime: node@24
          cache: true
          install: false

      - uses: Swatinem/rust-cache@v2.9.3

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - run: pnpm install --frozen-lockfile

      - name: Inject release version
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: node scripts/release/version.mjs set "$RELEASE_TAG"

      - run: pnpm build:ui

      - name: Rust formatting
        run: cargo fmt --check

      - name: Cross-target library check
        env:
          AIDGET_CHECK_TARGET: '1'
        run: cargo check --lib

      - name: Rust tests
        run: cargo test

      - name: UI and release-script tests
        run: |
          pnpm exec vp check
          pnpm test
          pnpm typegen --check
