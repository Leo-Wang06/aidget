<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="aidget-surface" content="none" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article class="welcome">
      <header class="brand">
        <span class="wordmark">AIDGET</span>
        <span class="version">v0.1.0</span>
      </header>

      <h1>把桌面交给 <span>Agent</span></h1>

      <section class="usage" aria-labelledby="usage-label">
        <h2 class="usage-label" id="usage-label">在 Agent 中下达指令</h2>

        <div class="prompt">
          <span class="typed"
            ><span class="prompt-value">/Aidget 创建一个水彩风格的便签小组件</span></span
          >
          <span class="send" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none">
              <path
                d="M8 12.5V3.5M3.8 7.7 8 3.5l4.2 4.2"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
      </section>
    </article>
  </body>
</html>
